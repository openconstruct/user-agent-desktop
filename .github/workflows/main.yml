name: Build Umbra Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      CC: /usr/bin/clang-21
      CXX: /usr/bin/clang++-21
      HOST_CC: /usr/bin/clang-21
      HOST_CXX: /usr/bin/clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          submodules: recursive
      
      - name: Install all Firefox build dependencies
        run: |
          # Add Python 3.12 PPA
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt update
          
          # Install complete Firefox build toolchain
          sudo apt install -y \
            python3.12 \
            python3.12-dev \
            python3.12-venv \
            python3-pip \
            nodejs \
            npm \
            rpm \
            dpkg-dev \
            git \
            curl \
            wget \
            mercurial \
            build-essential \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-glib-1-dev \
            libdbus-1-dev \
            libpulse-dev \
            libasound2-dev \
            libxt-dev \
            libx11-xcb-dev \
            libxrender-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            yasm \
            nasm \
            cargo \
            rustc \
            rust-src \
            cbindgen \
            libssl-dev \
            libffi-dev \
            zip \
            unzip \
            flatpak \
            flatpak-builder \
            desktop-file-utils
          
          # Keep Ubuntu's system Python for apt_pkg and add-apt-repository.
          # Firefox build steps invoke python3.12 explicitly below.
      
      - name: Install LLVM 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install -y llvm-21-dev libclang-21-dev lld-21
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          "$CC" --version
          "$CXX" --version

      - name: Setup Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk//24.08
      
      - name: Install WASI SDK
        run: |
          # SDK 25 bundles LLVM 19, the minimum supported by this Firefox source.
          WASI_VERSION=25
          mkdir -p $HOME/.local
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sdk-${WASI_VERSION}.0-x86_64-linux.tar.gz
          tar xf wasi-sdk-${WASI_VERSION}.0-x86_64-linux.tar.gz -C $HOME/.local
          mv $HOME/.local/wasi-sdk-${WASI_VERSION}.0-x86_64-linux $HOME/.local/wasi-sdk
          echo "WASI SDK installed at: $HOME/.local/wasi-sdk"
          "$HOME/.local/wasi-sdk/bin/clang" --version
      
      - name: Install bindgen via cargo
        run: cargo install cbindgen bindgen-cli
      
      - name: Install fern.js dependencies
        run: npm install
      
      - name: Run fern.js setup
        run: |
          ./fern.js use
          ./fern.js reset
          ./fern.js import-patches
      
      - name: Configure build
        working-directory: mozilla-release
        env:
          MOZCONFIG: ${{ github.workspace }}/brands/Umbra/mozconfig
        run: python3.12 ./mach configure
      
      - name: Build Umbra
        working-directory: mozilla-release
        env:
          MOZCONFIG: ${{ github.workspace }}/brands/Umbra/mozconfig
        run: |
          # Keep samples in the live log: a runner shutdown may skip later steps.
          sample_resources() {
            date -u
            free -h
            df -h . /tmp
            for metric in memory.current memory.peak memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                echo "cgroup $metric:"
                cat "/sys/fs/cgroup/$metric"
              fi
            done
          }
          monitor_resources() {
            while true; do
              sample_resources
              sleep 30 &
              monitor_sleep_pid=$!
              wait "$monitor_sleep_pid"
            done
          }
          (
            trap 'kill "${monitor_sleep_pid:-}" 2>/dev/null || true; exit 0' TERM INT
            monitor_resources
          ) &
          monitor_pid=$!
          cleanup() {
            build_status=$?
            trap - EXIT
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            sample_resources || true
            echo "Recent kernel messages (look for OOM kills):"
            sudo -n dmesg --ctime | tail -n 80 || true
            exit "$build_status"
          }
          trap cleanup EXIT
          trap 'echo "Build shell received SIGTERM"; exit 143' TERM
          trap 'echo "Build shell received SIGINT"; exit 130' INT
          # Lower peak memory use; this is a mitigation, not a confirmed OOM fix.
          python3.12 ./mach build -j2
      
      - name: Create browser package
        working-directory: mozilla-release
        env:
          MOZCONFIG: ${{ github.workspace }}/brands/Umbra/mozconfig
        run: python3.12 ./mach package
      
      - name: Build rpm/deb packages
        run: ./packaging/linux/build.sh
      
      - name: Build Flatpak package
        run: ./packaging/linux/build-flatpak.sh
      
      - name: Collect all packages
        run: |
          # Copy tar.xz from mozilla build directory to packaging/out
          cp .cache/firefox/140.8.0esr/firefox-140.8.0/obj-x86_64-pc-linux-gnu/dist/umbra-*.tar.xz packaging/out/
          
          # Copy flatpak from subdirectory to packaging/out
          cp packaging/out/flatpak/org.umbra.Browser-*.flatpak packaging/out/
      
      - name: List built packages
        run: ls -lh packaging/out/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: umbra-linux-packages
          path: |
            packaging/out/*.rpm
            packaging/out/*.deb
            packaging/out/*.tar.xz
            packaging/out/*.flatpak
          retention-days: 90
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packaging/out/*.rpm
            packaging/out/*.deb
            packaging/out/*.tar.xz
            packaging/out/*.flatpak
          body: |
            ## Umbra Browser ${{ github.ref_name }}
            
            **Reproducible build from source** - All packages built automatically via GitHub Actions.
            
            ### Verification
            - **Source commit:** ${{ github.sha }}
            - **Build logs:** [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            All packages are built from the exact source code tagged at this release. You can verify by:
            1. Checking out this tag: `git checkout ${{ github.ref_name }}`
            2. Following the build instructions in the workflow file
            3. Comparing checksums with your local build
            
            ### Packages
            - **RPM**: For Fedora, RHEL, openSUSE
            - **DEB**: For Debian, Ubuntu, Linux Mint
            - **tar.xz**: Universal Linux archive
            - **Flatpak**: Cross-distro package
            
            ### Build from Source
            See [.github/workflows/main.yml](https://github.com/${{ github.repository }}/blob/main/.github/workflows/main.yml) for the exact build process.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
