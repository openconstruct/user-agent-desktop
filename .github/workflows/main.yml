name: Build Umbra Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      CC: /usr/bin/clang-21
      CXX: /usr/bin/clang++-21
      HOST_CC: /usr/bin/clang-21
      HOST_CXX: /usr/bin/clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_BUILD_JOBS: 1
      MOZCONFIG: ${{ github.workspace }}/.mozconfig-ci
      OBJ_DIR: ${{ github.workspace }}/mozilla-release/obj-ci
      TZ: UTC
      LC_ALL: C.UTF-8
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          submodules: recursive
      
      - name: Install all Firefox build dependencies
        run: |
          # Add Python 3.12 PPA
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt update
          
          # Install complete Firefox build toolchain
          sudo apt install -y \
            python3.12 \
            python3.12-dev \
            python3.12-venv \
            python3-pip \
            nodejs \
            npm \
            rpm \
            dpkg-dev \
            git \
            curl \
            wget \
            mercurial \
            build-essential \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-glib-1-dev \
            libdbus-1-dev \
            libpulse-dev \
            libasound2-dev \
            libxt-dev \
            libx11-xcb-dev \
            libxrender-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libxdamage-dev \
            libxcomposite-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            yasm \
            nasm \
            libssl-dev \
            libffi-dev \
            zip \
            unzip \
            flatpak \
            flatpak-builder \
            desktop-file-utils
          
          # Keep Ubuntu's system Python for apt_pkg and add-apt-repository.
          # Firefox build steps invoke python3.12 explicitly below.
      
      - name: Install LLVM 21
        run: |
          # Use Jammy packages and its native libc, not a Debian sysroot.
          curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          llvm_version='1:21.1.8~++20251221032842+2078da43e25a-1~exp1~20251221153008.77'
          sudo apt-get install -y "clang-21=$llvm_version" "llvm-21-dev=$llvm_version" "libclang-21-dev=$llvm_version" "lld-21=$llvm_version"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          "$CC" --version
          "$CXX" --version

      - name: Setup Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08
          sudo flatpak install -y flathub org.freedesktop.Sdk//24.08
      
      - name: Install WASI SDK
        run: |
          # Match the successful local 153.2 build; verify the release asset.
          archive="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux.tar.gz"
          curl -fL --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum -c -
          mkdir -p "$HOME/.local"
          tar xf "$archive" -C "$HOME/.local"
          echo "WASI_SDK_PATH=$HOME/.local/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          "$HOME/.local/wasi-sdk-34.0-x86_64-linux/bin/clang" --version

      - name: Install pinned Rust and binding tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
          cargo install cbindgen --version 0.29.4 --locked --force
          cargo install bindgen-cli --version 0.73.1 --locked --force
          echo "RUSTC=$(rustup which rustc)" >> "$GITHUB_ENV"
          echo "CARGO=$(rustup which cargo)" >> "$GITHUB_ENV"
          echo "CBINDGEN=$HOME/.cargo/bin/cbindgen" >> "$GITHUB_ENV"
          rustc --version --verbose
          cargo --version
          "$HOME/.cargo/bin/cbindgen" --version

      - name: Install fern.js dependencies
        run: npm ci
      
      - name: Run fern.js setup
        run: |
          ./fern.js use
          ./fern.js reset
          ./fern.js import-patches
      
      - name: Add swap for Firefox compilation
        run: |
          # Final Rust optimization can exceed RAM even with mach build -j1.
          # Add capacity without removing the runner's existing swap.
          swap_file="$RUNNER_TEMP/umbra-build.swap"
          sudo fallocate -l 24G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          free -h
          df -h "$RUNNER_TEMP"

      - name: Prepare CI configuration and build record
        run: |
          # Honor branding/options while fixing the CI output path and tool source.
          cat > "$MOZCONFIG" <<EOF
          . "$GITHUB_WORKSPACE/brands/Umbra/mozconfig"
          ac_add_options --host=x86_64-unknown-linux-gnu
          ac_add_options --disable-bootstrap
          mk_add_options MOZ_OBJDIR="$OBJ_DIR"
          EOF
          epoch=$(git show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "MOZ_BUILD_DATE=$(date -u -d "@$epoch" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          mkdir -p packaging/out
          {
            echo "Source commit: $GITHUB_SHA"
            cat .workspace
            sha256sum package-lock.json brands/Umbra/mozconfig
            shopt -s nullglob
            input_archives=(.cache/firefox/*/*.source.tar.xz .cache/*/*.zip)
            if [ "${#input_archives[@]}" -gt 0 ]; then
              sha256sum "${input_archives[@]}"
            fi
            cat /etc/os-release
            getconf GNU_LIBC_VERSION
            "$CC" --version
            "$CXX" --version
            rustc --version --verbose
            cargo --version
            "$CBINDGEN" --version
            "$WASI_SDK_PATH/bin/clang" --version
            node --version
            npm --version
            dpkg-query -W
            flatpak list --columns=application,branch,commit
          } > packaging/out/build-info.txt

      - name: Configure build
        working-directory: mozilla-release
        run: |
          python3.12 ./mach configure
          cat "$OBJ_DIR/.mozconfig" >> "$GITHUB_WORKSPACE/packaging/out/build-info.txt"
          cat "$OBJ_DIR/config/autoconf.mk" >> "$GITHUB_WORKSPACE/packaging/out/build-info.txt"
      
      - name: Build Umbra
        working-directory: mozilla-release
        run: |
          # Limit concurrent compilation on the 16 GiB hosted runner.
          free -h
          df -h .
          python3.12 ./mach build -j1
      
      - name: Create browser package
        working-directory: mozilla-release
        run: python3.12 ./mach package
      
      - name: Check Ubuntu 22.04 glibc compatibility
        run: |
          python3.12 - <<'PYTHON'
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ["OBJ_DIR"]) / "dist" / "umbra"
          if not root.is_dir():
              raise SystemExit(f"Missing packaged browser directory: {root}")
          incompatible = []
          checked = 0
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              with path.open("rb") as stream:
                  if stream.read(4) != b"\x7fELF":
                      continue
              checked += 1
              versions = subprocess.check_output(
                  ["readelf", "--version-info", str(path)], text=True
              )
              needs = versions.partition("Version needs section")[2]
              for version in set(re.findall(r"Name: GLIBC_([0-9.]+)", needs)):
                  if tuple(map(int, version.split("."))) > (2, 35):
                      incompatible.append(f"{path.relative_to(root)}: GLIBC_{version}")
          if not checked:
              raise SystemExit("No ELF files found to audit")
          report = f"Audited {checked} ELF files; maximum allowed glibc requirement: 2.35\n"
          report += "\n".join(incompatible) if incompatible else "PASS\n"
          with open("packaging/out/build-info.txt", "a") as stream:
              stream.write(report)
          print(report)
          if incompatible:
              raise SystemExit("Packaged binaries require glibc newer than Ubuntu 22.04")
          PYTHON

      - name: Build rpm/deb packages
        env:
          BUILD_RPM: "1"
        run: ./packaging/linux/build.sh
      
      - name: Build Flatpak package
        run: ./packaging/linux/build-flatpak.sh
      
      - name: Collect all packages
        run: |
          # Copy tar.xz from mozilla build directory to packaging/out
          cp "$OBJ_DIR"/dist/umbra-*.tar.xz packaging/out/
          
          # Copy flatpak from subdirectory to packaging/out
          cp packaging/out/flatpak/org.umbra.Browser-*.flatpak packaging/out/
      
      - name: Record package checksums
        working-directory: packaging/out
        run: |
          sha256sum *.rpm *.deb *.tar.xz *.flatpak > SHA256SUMS
          ls -lh

      
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: umbra-linux-packages
          path: |
            packaging/out/*.rpm
            packaging/out/*.deb
            packaging/out/*.tar.xz
            packaging/out/*.flatpak
            packaging/out/SHA256SUMS
            packaging/out/build-info.txt
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (Node.js 24)
        with:
          files: |
            packaging/out/*.rpm
            packaging/out/*.deb
            packaging/out/*.tar.xz
            packaging/out/*.flatpak
            packaging/out/SHA256SUMS
            packaging/out/build-info.txt
          body: |
            ## Umbra Browser ${{ github.ref_name }}
            
            **Public build from source** - Packages built via GitHub Actions on Ubuntu 22.04. Release downloads are the same files uploaded as workflow artifacts.
            
            ### Verification
            - **Source commit:** ${{ github.sha }}
            - **Build logs:** [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Download SHA256SUMS and the packages into the same directory, then run:
            `sha256sum --check --ignore-missing SHA256SUMS`

            For comparison with the public build, download the workflow artifact and compare
            its SHA256SUMS with the release copy. build-info.txt records the build environment.
            Matching hashes verify identical package bytes; independent rebuilds are not yet
            guaranteed to produce identical hashes.
            
            ### Packages
            - **RPM**: For Fedora, RHEL, openSUSE
            - **DEB**: For Debian, Ubuntu, Linux Mint
            - **tar.xz**: Universal Linux archive
            - **Flatpak**: Cross-distro package
            
            ### Build from Source
            See [.github/workflows/main.yml](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/main.yml) for the exact build process.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
